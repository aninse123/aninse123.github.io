# Netlify configuration — Douro Partners

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Firebase Web API keys are intentionally public — security is enforced
  # via Firestore Security Rules, not by hiding the key. This disables
  # Netlify's smart secret detection which incorrectly flags Firebase keys.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# ── Security headers (applied to every response) ──────────────────────────────
# Note: script-src/style-src allow 'unsafe-inline' because the portal pages use
# inline <script type="module"> blocks and inline styles. The CSP therefore
# provides origin-locking + clickjacking defence rather than full inline-XSS
# blocking (that would need moving all inline JS to external files). External
# origins are scoped to what the site actually uses: Google Fonts, the Firebase
# SDK (gstatic) + back-ends (googleapis / firebaseapp / firebasestorage),
# Web3Forms (contact form), Google Analytics/Tag Manager, Microsoft Clarity, and
# the Outreach callable Cloud Functions (*.cloudfunctions.net).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.firebasestorage.app https://*.cloudfunctions.net https://api.web3forms.com https://www.google-analytics.com https://*.google-analytics.com https://*.clarity.ms; frame-src 'self' https://*.clarity.ms; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; object-src 'none'"

# Extra domains (Valesintemporais LDA) -> douropartners.pt
[[redirects]]
  from = "https://valesintemporais.pt/*"
  to = "https://douropartners.pt/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.valesintemporais.pt/*"
  to = "https://douropartners.pt/"
  status = 301
  force = true

[[redirects]]
  from = "https://valesintemorais.pt/*"
  to = "https://douropartners.pt/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.valesintemorais.pt/*"
  to = "https://douropartners.pt/"
  status = 301
  force = true

# Outreach unsubscribe links (List-Unsubscribe header + email footer) are
# served from our own domain and proxied to the outreachUnsubscribe Cloud
# Function (status 200 = rewrite, so POSTs from one-click unsubscribe pass
# through unchanged).
[[redirects]]
  from = "/u/*"
  to = "https://us-central1-douro-partners.cloudfunctions.net/outreachUnsubscribe/:splat"
  status = 200
  force = true

# The site publishes the repo root, so server-side source and config would
# otherwise be downloadable (found 2026-09-25: functions/, netlify/functions/,
# the rules files and README all returned 200). No secrets live in them, but
# they expose admin addresses, the test list and server logic. Answer 404.
# force = true makes these win over the real files.
[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/storage.rules"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/firestore.indexes.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/firebase.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

